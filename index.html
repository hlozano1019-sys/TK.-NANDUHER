<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>TK.NANDUHER💎 | Creador</title>
<style>
:root{color-scheme:dark;--bg:#080d16;--panel:#101a29;--text:#f4f7fb;--muted:#a8b6c8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#173047 0%,transparent 55%),linear-gradient(145deg,#070b12,#0b1422);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.card{width:min(100%,430px);padding:34px 25px 26px;text-align:center;background:linear-gradient(160deg,rgba(19,31,48,.97),rgba(10,16,27,.98));border:1px solid #26364a;border-radius:24px;box-shadow:0 24px 70px #0009;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:0 20% auto;height:2px;background:linear-gradient(90deg,transparent,#45f3e2,#b6ff45,transparent)}
.badge{display:inline-block;padding:7px 12px;border:1px solid #45f3e255;border-radius:99px;color:#45f3e2;font-size:11px;font-weight:700;letter-spacing:2px}
.mascot{width:112px;height:112px;object-fit:cover;border-radius:50%;border:3px solid transparent;background:linear-gradient(#101a29,#101a29) padding-box,conic-gradient(#ff3cac,#784bff,#31d8ff,#45ff9a,#fff04a,#ff3cac) border-box;box-shadow:0 0 18px #31d8ff77,0 0 28px #ff3cac44;margin:18px auto 0;display:block}\n.easter-egg{position:fixed;right:12px;bottom:12px;width:82px;height:82px;object-fit:contain;z-index:20;filter:drop-shadow(0 6px 10px #000b) drop-shadow(0 0 8px #ff3cac55);transform:rotate(5deg);pointer-events:none;animation:eggFloat 3.8s ease-in-out infinite}.easter-egg::after{content:""}@keyframes eggFloat{0%,100%{transform:translateY(0) rotate(5deg)}50%{transform:translateY(-5px) rotate(2deg)}}
h1{margin:12px 0 7px;font-size:clamp(30px,9vw,42px);letter-spacing:3px;font-weight:900}
.sub{margin:0 0 25px;color:var(--muted);font-size:14px}
.links{display:grid;gap:14px}
.button{position:relative;isolation:isolate;width:100%;display:flex;align-items:center;justify-content:center;gap:11px;padding:15px 16px;border:0;border-radius:14px;background:linear-gradient(#121d2d,#121d2d) padding-box,conic-gradient(from var(--angle,0deg),#ff3cac,#784bff,#31d8ff,#45ff9a,#fff04a,#ff3cac) border-box;border:2px solid transparent;color:var(--text);font-size:15px;font-weight:800;text-decoration:none;cursor:pointer;box-shadow:0 0 8px #a34cff66,0 0 18px #35eaff33;transition:transform .15s,box-shadow .15s}
.button:hover{transform:translateY(-2px);box-shadow:0 0 12px #ff3cac99,0 0 26px #31d8ff66}
.button svg{width:25px;height:25px;flex:none;filter:drop-shadow(0 0 5px #ffffff44)}
.creator{margin-top:22px;padding:17px 15px;border:1px solid #b6ff4544;background:#b6ff450b;border-radius:15px}
.label{font-size:11px;letter-spacing:2px;color:#b6ff45;font-weight:800}
.code{margin:8px 0 13px;font-size:21px;letter-spacing:2px;font-weight:900}
button.copy{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:15px 16px;border-radius:13px;background:linear-gradient(90deg,#b6ff45,#45f3e2);color:#071019;border:0;font-size:15px;font-weight:800;cursor:pointer}button.copy img{width:32px;height:32px;object-fit:cover;border-radius:7px;box-shadow:0 0 7px #17253866;flex:none}
.games{margin-top:26px}.games h2{margin:0 0 14px;font-size:16px;letter-spacing:4px;color:#f4f7fb}.game-grid{display:grid;grid-template-columns:1fr;gap:11px}.game{display:flex;align-items:center;justify-content:center;min-height:66px;padding:14px;border-radius:13px;background:linear-gradient(#101a29,#101a29) padding-box,conic-gradient(from var(--angle,0deg),#ff3cac,#784bff,#31d8ff,#45ff9a,#fff04a,#ff3cac) border-box;border:2px solid transparent;box-shadow:0 0 10px #784bff44;font-weight:900;letter-spacing:1.2px;text-transform:uppercase}.game:nth-child(1){font-size:17px;color:#dceeff;text-shadow:0 0 10px #31d8ff}.game:nth-child(2){font-size:15px;color:#ffd18b;text-shadow:0 0 9px #ff7b28}.game:nth-child(3){font-size:16px;color:#e8f5e8;text-shadow:0 0 9px #b6ff45}.game small{display:block;font-size:9px;letter-spacing:2px;color:#a8b6c8;margin-top:4px;text-shadow:none}footer{margin-top:20px;color:#718198;font-size:11px;letter-spacing:1px}
@media(max-width:480px){.easter-egg{width:70px;height:70px;right:6px;bottom:6px}}
@media(prefers-reduced-motion:no-preference){.button{animation:neon 6s linear infinite}@keyframes neon{to{--angle:360deg}}}
</style>
</head>
